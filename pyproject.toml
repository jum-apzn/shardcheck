[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shardcheck"
version = "0.1.0"
description = "Offline completeness and integrity preflight for CI shard artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "dot"}]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]
dependencies = []

[project.scripts]
shardcheck = "shardcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
